<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#481a2a">
<title>Charming Beauty Care | Share Your Experience</title>
<style>
:root {
  --wine:#481a2a;
  --wine-dark:#30101c;
  --gold:#c9a45c;
  --cream:#faf5ee;
  --ink:#38262b;
  --muted:#786970;
  --border:#eaded5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:linear-gradient(#faf5eeeb,#faf5eeef),
             url("salon-bg.jpg") center/cover fixed;
}
.page { width:min(680px,100%); margin:auto; padding:16px; }
.hero {
  background:linear-gradient(135deg,var(--wine),var(--wine-dark));
  border:1px solid var(--gold);
  border-radius:20px;
  padding:24px 16px;
  text-align:center;
  color:white;
  box-shadow:0 8px 24px #30101c25;
}
.logo {
  width:78px;height:78px;object-fit:contain;
  border-radius:50%;background:white;padding:4px;
  margin-bottom:8px;
}
h1 {
  font-family:Georgia,"Times New Roman",serif;
  color:#efd49b;font-size:27px;margin:4px 0 8px;
  letter-spacing:.5px;
}
.hero p { margin:5px 0;color:#f8eadd;line-height:1.5; }
.stars { color:#e9c77e;font-size:23px;letter-spacing:3px; }
.intro { text-align:center;line-height:1.6;margin:20px 0; }
.intro h2 { color:var(--wine);font-size:21px;margin-bottom:6px; }
.intro p { color:var(--muted);font-size:14px;margin:0; }
.counter {
  display:flex;justify-content:space-between;gap:8px;
  color:var(--muted);font-size:13px;margin:16px 2px 10px;
}
.review {
  background:#fff;border:1px solid var(--border);
  border-radius:15px;padding:15px;margin:12px 0;
  box-shadow:0 3px 12px #30101c08;
}
.review-top { display:flex;justify-content:space-between;gap:8px;align-items:center; }
.review-number { font-weight:bold;color:var(--wine);font-size:14px; }
.lang {
  font-size:11px;background:#f5ead7;color:#694b26;
  border-radius:20px;padding:5px 9px;
}
textarea {
  width:100%;min-height:115px;resize:vertical;
  margin:12px 0 10px;padding:12px;
  border:1px solid #e7d9cf;border-radius:10px;
  font:15px/1.65 Arial,sans-serif;color:var(--ink);
  background:#fffdfa;outline:none;
}
textarea:focus { border-color:var(--gold);box-shadow:0 0 0 2px #c9a45c20; }
.hint { font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 10px; }
.actions { display:flex;gap:8px;flex-wrap:wrap; }
button,.google-link {
  display:inline-flex;align-items:center;justify-content:center;
  gap:7px;padding:12px 14px;border-radius:10px;
  border:1px solid transparent;font-size:14px;
  font-weight:bold;cursor:pointer;text-decoration:none;
  transition:transform .15s,opacity .15s;
}
button:active,.google-link:active { transform:scale(.98); }
.copy { background:var(--wine);color:white;flex:1; }
.copy:disabled { opacity:.4;cursor:not-allowed; }
.reset { background:white;color:var(--wine);border-color:var(--border); }
.main-button {
  width:100%;margin-top:12px;padding:15px;
  background:#f1e3c8;color:var(--wine);border:1px solid var(--gold);
}
.google-link {
  width:100%;margin-top:12px;padding:16px;
  background:var(--wine);color:white;font-size:16px;
}
.notice
