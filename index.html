/* ================= RANDOM REVIEWS ================= */

function getRandomReviews(){

let shuffled = [...reviews].sort(() => Math.random() - 0.5);

return shuffled.slice(0,3);

}


/* ================= SHOW REVIEWS ================= */

function showReviews(){

const box = document.getElementById("reviews");

box.innerHTML = "";

getRandomReviews().forEach(item => {

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `

<div class="language">
${item.lang}
</div>

<div class="review">
${item.text}
</div>

<button class="copy" onclick="copyReview(this)">
📋 Review Copy करें
</button>

`;

box.appendChild(card);

});

}


/* ================= COPY BUTTON ================= */

function copyReview(button){

const text =
button.parentElement.querySelector(".review").innerText;

if(navigator.clipboard){

navigator.clipboard.writeText(text).then(() => {

button.innerText = "✅ Copy हो गया";

setTimeout(() => {

button.innerText = "📋 Review Copy करें";

},2000);

});

}else{

const textarea = document.createElement("textarea");

textarea.value = text;

document.body.appendChild(textarea);

textarea.select();

document.execCommand("copy");

textarea.remove();

button.innerText = "✅ Copy हो गया";

setTimeout(() => {

button.innerText = "📋 Review Copy करें";

},2000);

}

}


/* ================= FIRST LOAD ================= */
